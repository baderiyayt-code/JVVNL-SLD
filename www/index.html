<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- Sabhi external connections aur scripts ko allow karne ke liye relax CSP -->
    <meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval' data: blob: gap:; style-src * 'unsafe-inline'; script-src * 'unsafe-inline' 'unsafe-eval';">
    
    <title>DISCOM GIS Survey</title>
    
    <!-- CSS Link -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Splash Screen -->
    <div id="splash-screen">
        <div class="loader-animation">
            <h2>DISCOM GIS Syncing...</h2>
        </div>
    </div>

    <!-- Auth Screen -->
    <div id="auth-screen" class="hidden">
        <div class="auth-box">
            <h2>Surveyor Login</h2>
            <input type="email" id="email" placeholder="Email (e.g. surveyor@discom.com)">
            <input type="password" id="password" placeholder="Password">
            
            <button id="btn-login">Secure Login</button>
            <button id="btn-signup" style="background: #28a745; margin-top: 12px;">Create Account</button>
            <button id="btn-skip" style="background: #666; margin-top: 12px;">Skip Login (Test Map)</button>
        </div>
    </div>

    <!-- Main App UI -->
    <div id="app-ui" class="hidden">
        <div id="map" style="width:100%; height:100vh; background: #e5e5e5; display:flex; justify-content:center; align-items:center;">
            <h2>Map Area Loading...</h2>
        </div>
    </div>

    <!-- Scripts hamesha body ke end mein honi chahiye taaki UI block na ho -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/auth.js"></script>
</body>
</html>
