<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>DISCOM GIS Survey App</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- jsPDF for PDF export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <!-- localForage for Offline DB -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="light-mode">

    <!-- Splash Screen -->
    <div id="splash-screen">
        <div class="animation-container">
            <div class="pole"></div>
            <div class="wire"></div>
        </div>
        <h2>DISCOM SLD Survey</h2>
        <p>Loading Assets...</p>
    </div>

    <!-- Auth Screen -->
    <div id="auth-screen" class="glass-panel hidden">
        <div class="auth-box">
            <h2>DISCOM Login</h2>
            <input type="text" id="auth-name" placeholder="Full Name (Signup only)" />
            <input type="email" id="auth-email" placeholder="Email" />
            <input type="password" id="auth-password" placeholder="Password" />
            <button id="btn-login" class="btn primary">Login</button>
            <button id="btn-signup" class="btn secondary">Sign Up</button>
        </div>
    </div>

    <!-- Main App Container -->
    <div id="app-container" class="hidden">
        
        <!-- Header & Search -->
        <header class="top-header glass">
            <button id="btn-menu"><i class="fas fa-bars"></i></button>
            <div class="search-container">
                <input type="text" id="search-bar" placeholder="Search Consumers, DTs, Poles..." />
                <ul id="search-suggestions" class="glass hidden"></ul>
            </div>
            <button id="btn-sync"><i class="fas fa-cloud-upload-alt"></i></button>
        </header>

        <!-- KPI Bar -->
        <div class="kpi-bar glass">
            <div class="kpi-item">11KV: <span id="kpi-11kv">0</span>m</div>
            <div class="kpi-item">LT: <span id="kpi-lt">0</span>m</div>
            <div class="kpi-item">DTs: <span id="kpi-dt">0</span></div>
            <div class="kpi-item">Cons: <span id="kpi-cons">0</span></div>
        </div>

        <!-- Sidebar Navigation -->
        <div id="sidebar" class="sidebar glass hidden">
            <div class="profile-section">
                <i class="fas fa-user-circle fa-3x"></i>
                <h3 id="user-display-name">Surveyor</h3>
            </div>
            <ul>
                <li id="menu-gss"><i class="fas fa-industry"></i> GSS Management</li>
                <li id="menu-feeder"><i class="fas fa-route"></i> Feeder Management</li>
                <li id="menu-orphan"><i class="fas fa-plug-circle-exclamation"></i> Find Orphan Nodes</li>
                <li id="menu-export"><i class="fas fa-file-export"></i> Export Data</li>
                <li id="menu-settings"><i class="fas fa-cog"></i> Settings</li>
                <li id="menu-logout"><i class="fas fa-sign-out-alt"></i> Secure Logout</li>
            </ul>
        </div>

        <!-- Map Container -->
        <div id="map"></div>

        <!-- Center Crosshair for Object Placement -->
        <div id="crosshair" class="hidden">
            <i class="fas fa-crosshairs"></i>
            <button id="btn-confirm-placement" class="btn primary">Place Here</button>
            <button id="btn-cancel-placement" class="btn danger">Cancel</button>
        </div>

        <!-- Floating Action Button (FAB) Speed Dial -->
        <div class="fab-container">
            <div class="fab-menu hidden">
                <button class="fab-item" data-type="consumer" title="Add Consumer"><i class="fas fa-home"></i></button>
                <button class="fab-item" data-type="line" title="Add Line"><i class="fas fa-wave-square"></i></button>
                <button class="fab-item" data-type="dt" title="Add DT"><i class="fas fa-bolt"></i></button>
                <button class="fab-item" data-type="pole" title="Add Pole"><i class="fas fa-map-pin"></i></button>
                <button class="fab-item" data-type="gss" title="Add GSS"><i class="fas fa-building"></i></button>
            </div>
            <button id="btn-fab-main" class="fab primary"><i class="fas fa-plus"></i></button>
        </div>

        <!-- Data Entry Modal -->
        <div id="data-modal" class="modal-overlay hidden">
            <div class="modal glass">
                <h3 id="modal-title">Add Entity</h3>
                <form id="data-form">
                    <!-- Dynamically injected fields -->
                </form>
                <button type="button" id="btn-capture-photo" class="btn secondary"><i class="fas fa-camera"></i> Capture Photo</button>
                <img id="photo-preview" class="hidden" />
                <div class="modal-actions">
                    <button id="btn-save-entity" class="btn primary">Save</button>
                    <button id="btn-close-modal" class="btn danger">Cancel</button>
                </div>
            </div>
        </div>

        <!-- Export Modal -->
        <div id="export-modal" class="modal-overlay hidden">
            <div class="modal glass">
                <h3>Export Data</h3>
                <button class="btn primary export-btn" data-format="pdf"><i class="fas fa-file-pdf"></i> SLD PDF (A0)</button>
                <button class="btn primary export-btn" data-format="csv"><i class="fas fa-file-csv"></i> GIS CSV</button>
                <button class="btn primary export-btn" data-format="kml"><i class="fas fa-globe"></i> KML</button>
                <button class="btn primary export-btn" data-format="dxf"><i class="fas fa-drafting-compass"></i> DXF</button>
                <button id="btn-close-export" class="btn danger mt-1">Cancel</button>
            </div>
        </div>

    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>
</body>
</html>
