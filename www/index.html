<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- CRITICAL FIX: Sabhi scripts aur connections ko allow karne ke liye CSP -->
    <meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval' data: blob: gap: https://ssl.gstatic.com; style-src * 'unsafe-inline'; media-src *; img-src * data: content: blob:;">
    
    <title>DISCOM GIS Survey</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Splash Screen -->
    <div id="splash-screen">
        <div class="loader-animation">
            <h2>DISCOM GIS Syncing...</h2>
        </div>
    </div>

    <!-- Auth Screen -->
    <div id="auth-screen" class="hidden">
        <div class="auth-box">
            <h2>Surveyor Login</h2>
            <input type="email" id="email" placeholder="Email (e.g. surveyor@discom.com)">
            <input type="password" id="password" placeholder="Password">
            
            <button id="btn-login">Secure Login</button>
            <button id="btn-signup" style="background: #28a745; margin-top: 12px;">Create Account</button>
            <button id="btn-skip" style="background: #666; margin-top: 12px;">Skip Login (Test Map)</button>
        </div>
    </div>

    <!-- Main App UI -->
    <div id="app-ui" class="hidden">
        <h2 style="padding: 20px;">Map Area (Test Mode)</h2>
    </div>

    <!-- External Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Custom Scripts -->
    <script src="js/auth.js"></script>
</body>
</html>
