<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- FIX: बहुत ही Permissive CSP ताकि Android किसी भी स्क्रिप्ट को ब्लॉक न करे -->
    <meta http-equiv="Content-Security-Policy" content="default-src * data: blob: gap: 'unsafe-inline' 'unsafe-eval' ws: wss:;">
    
    <title>DISCOM GIS Survey</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Splash Screen -->
    <div id="splash-screen">
        <div class="loader-animation">
            <svg viewBox="0 0 100 100" class="pole-svg">
                <rect x="45" y="20" width="10" height="80" fill="#333" class="pole"/>
                <path d="M20,50 L45,25 L70,50" stroke="#007bff" stroke-width="2" fill="none" class="wire"/>
            </svg>
            <h2>DISCOM GIS Syncing...</h2>
        </div>
    </div>

            <!-- Auth Screen -->
    <div id="auth-screen" class="hidden">
        <div class="auth-box">
            <h2>Surveyor Login</h2>
            <input type="email" id="email" placeholder="Email (e.g. surveyor@discom.com)">
            <input type="password" id="password" placeholder="Password">
            
            <!-- Removed onclick, added IDs -->
            <button id="login-btn">Secure Login</button>
            <button id="signup-btn" style="background: #28a745; margin-top: 12px;">Create Account</button>
            <button id="skip-btn" style="background: #666; margin-top: 12px;">Skip Login (Test Map)</button>
        </div>
    </div>



    <!-- Main App UI -->
    <div id="app-ui" class="hidden">
        <div class="kpi-bar disable-click">
            <div class="kpi">HT: <span id="kpi-ht">0</span> km</div>
            <div class="kpi">LT: <span id="kpi-lt">0</span> km</div>
            <div class="kpi">DTs: <span id="kpi-dt">0</span></div>
            <div class="kpi">Cons: <span id="kpi-cons">0</span></div>
        </div>

        <div class="search-box disable-click">
            <input type="text" id="search-input" placeholder="Search Node/Consumer ID...">
        </div>

        <div id="map"></div>

        <div class="crosshair-container hidden" id="crosshair">
            <div class="crosshair"></div>
            <button class="confirm-btn disable-click" onclick="App.confirmLocation()">Confirm Placement</button>
        </div>

        <div class="fab-container disable-click">
            <div class="speed-dial hidden" id="speed-dial">
                <button onclick="App.startPlacement('GSS')">Add GSS</button>
                <button onclick="App.startPlacement('HT_POLE')">Add HT Pole</button>
                <button onclick="App.startPlacement('DT')">Add DT</button>
                <button onclick="App.startPlacement('LT_POLE')">Add LT Pole</button>
                <button onclick="App.startPlacement('CONSUMER')">Add Consumer</button>
            </div>
            <button class="fab-main" onclick="App.toggleFAB()">+</button>
        </div>

        <div class="sidebar disable-click hidden" id="sidebar">
            <h3>Menu</h3>
            <button onclick="App.syncToCloud()">Sync to Cloud</button>
            <button onclick="Export.generateJSON()">Backup (JSON)</button>
            <button onclick="Export.generateKML()">Export KML</button>
            <button onclick="Export.generateCSV()">Export CSV</button>
            <button onclick="Auth.logout()" class="logout-btn">Logout</button>
        </div>
        <button class="menu-btn disable-click" onclick="App.toggleSidebar()">☰</button>
    </div>

    <!-- Libraries -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/localforage@1.10.0/dist/localforage.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <!-- App Logic -->
    <script src="js/auth.js"></script>
    <script src="js/export.js"></script>
    <script src="js/app.js"></script>

    <!-- CRITICAL FIX: Fail-safe mechanism -->
    <!-- अगर ऊपर की कोई भी फाइल क्रैश होती है, तो यह 3 सेकंड बाद Splash Screen को जबरदस्ती हटा देगा -->
    <script>
        setTimeout(() => {
            const splash = document.getElementById('splash-screen');
            if (splash && !splash.classList.contains('hidden')) {
                splash.classList.add('hidden');
                document.getElementById('auth-screen').classList.remove('hidden');
                console.warn("Forced splash screen removal due to slow load or JS error.");
            }
        }, 3000);
    </script>
</body>
</html>
