name: Cordova Build
on:
  push:
    branches: [ main ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # FIX: Pin Gradle to version 8.7 to maintain compatibility with Cordova's Groovy scripts
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Install Cordova
        run: npm install -g cordova

      # FIX: Explicitly use cordova-android@13 to ensure compatibility with Java 17 & Gradle 8
      - name: Add Android Platform
        run: cordova platform add android@13

      - name: Build APK
        run: cordova build android --release

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk
